[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canadapulse"
version = "0.1.0"
description = "Canadian economic and labour-market data platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "CanadaPulse Contributors" }
]
dependencies = [
  "psycopg[binary]>=3.2.0",
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
warehouse = [
  "dbt-core>=1.11,<1.12",
  "dbt-postgres>=1.10,<1.11",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.3.0",
  "ruff>=0.6.9",
]

[project.scripts]
canadapulse = "canadapulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
canadapulse = ["api/*.html"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
