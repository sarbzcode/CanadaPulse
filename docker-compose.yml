services:
  postgres:
    image: postgres:16
    container_name: canadapulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canadapulse}
      POSTGRES_USER: ${POSTGRES_USER:-canadapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canadapulse_local_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
