services:
  airflow:
    profiles: [airflow]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      CANADAPULSE_DB_HOST: postgres
      CANADAPULSE_DB_PORT: "5432"
      CANADAPULSE_DB_NAME: ${POSTGRES_DB:-canadapulse}
      CANADAPULSE_DB_USER: ${POSTGRES_USER:-canadapulse}
      CANADAPULSE_DB_PASSWORD: ${POSTGRES_PASSWORD:-canadapulse_local_password}
    depends_on:
      postgres:
        condition: service_healthy
