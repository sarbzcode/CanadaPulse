name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canadapulse
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: canadapulse_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U canadapulse"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CANADAPULSE_DB_HOST: localhost
      CANADAPULSE_DB_PORT: '5432'
      CANADAPULSE_DB_NAME: canadapulse_ci
      CANADAPULSE_DB_USER: canadapulse
      CANADAPULSE_DB_PASSWORD: ci_password
      CANADAPULSE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
